[project]
name = "civitas-api"
version = "0.1.0"
description = "CivitasX grounded Bengaluru research, cases, and MCP service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "mcp>=1.26,<2",
  "pydantic-settings>=2.8,<3",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.10,<3",
  "boto3>=1.40,<2",
  "pypdf>=5.4,<7",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
aws-smoke = ["bedrock-agentcore>=1.23,<2", "playwright>=1.63,<2"]
architecture = [
  "langgraph>=0.6,<1",
  "haystack-ai>=2.17,<3",
  "opentelemetry-api>=1.29,<2",
  "opentelemetry-sdk>=1.29,<2",
  "Pillow>=10,<13",
  "psycopg[binary]>=3.2,<4",
  "temporalio>=1.8,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.26,<2", "moto[dynamodb]>=5.1,<6", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/civitas_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/civitas_api/store.py" = ["E501"]
"src/civitas_api/community_store.py" = ["E501"]
"src/civitas_api/dynamo_community_store.py" = ["E501"]
